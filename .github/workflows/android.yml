
name: Build SALATI APK
      - name: Print PrayerTimeCalculator source
        run: |
          cat Salati/app/src/main/java/com/salati/app/PrayerTimeCalculator.kt

on:
  workflow_dispatch:
  push:
    paths:
      - "SALATI-Android-Project.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: |
          unzip -o SALATI-Android-Project.zip -d .
          test -f Salati/settings.gradle.kts
          test -f Salati/app/build.gradle.kts

      - name: Build APK
        working-directory: Salati
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SALATI-debug-APK
          path: Salati/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
